<!doctype html>
<html lang="zh-CN" data-theme="morandi-cream">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F0EA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>今天怎么吃</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=70" />
</head>
<body>
  <div class="phone-shell">
    <header class="topbar">
      <div>
        <p id="dateLabel" class="date-label">今天</p>
        <h1 id="greetingTitle">今天怎么吃</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="设置">⚙️</button>
    </header>

    <main id="app" class="app-content"></main>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item active" data-page="home"><span>🏠</span><small>首页</small></button>
      <button class="nav-item" data-page="log"><span>🍱</span><small>记录</small></button>
      <button class="nav-item" data-page="lists"><span>🧺</span><small>清单</small></button>
      <button class="nav-item" data-page="life"><span>💧</span><small>生活</small></button>
      <button class="nav-item" data-page="body"><span>📈</span><small>身体</small></button>
      <button class="nav-item" data-page="journal"><span>🌙</span><small>日记</small></button>
      <button class="nav-item" data-page="me"><span>✦</span><small>我</small></button>
    </nav>
  </div>

  <button id="cameraFab" class="camera-fab" aria-label="拍照识别">📷</button>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <h2>设置</h2>
          <p>名字、目标和颜色都可以在这里改。</p>
        </div>
        <button value="cancel" class="icon-btn" aria-label="关闭">×</button>
      </div>

      <section class="settings-section">
        <h3>基础</h3>
        <label>小软件名字
          <input id="appNameInput" type="text" placeholder="比如：今天怎么吃" />
        </label>
        <label>昵称
          <input id="nicknameInput" type="text" placeholder="比如：Celia" />
        </label>
        <div class="form-row">
          <label>每日目标热量 kcal
            <input id="calorieTargetInput" type="number" min="800" step="50" />
          </label>
          <label>每日蛋白质目标 g
            <input id="proteinTargetInput" type="number" min="20" step="5" />
          </label>
        </div>
        <div class="form-row">
          <label>每日饮水目标 杯
            <input id="waterTargetInput" type="number" min="1" max="20" step="1" />
          </label>
          <label>目标体重 kg
            <input id="weightTargetInput" type="number" min="20" step="0.1" />
          </label>
        </div>
        <label>我的饮食偏好
          <textarea id="preferenceInput" rows="3" placeholder="比如：喜欢辣，喜欢热食，减脂但不想极端节食"></textarea>
        </label>
      </section>

      <section class="settings-section">
        <h3>AI 拍照识别</h3>
        <p class="soft-note">这里填 Cloudflare Worker 后端地址和你自己设置的访问口令。不要把 OpenAI API key 填在这里，也不要上传到 GitHub。</p>
        <label>AI 后端地址
          <input id="aiProxyUrlInput" type="url" placeholder="例如：https://your-worker.your-name.workers.dev/analyze-food" />
        </label>
        <label>AI 访问口令
          <input id="aiClientTokenInput" type="password" placeholder="你在 Worker 里设置的 APP_CLIENT_TOKEN" autocomplete="off" />
        </label>
        <label>默认图片细节
          <select id="aiDetailInput">
            <option value="low">低细节：更省钱，适合普通单人餐</option>
            <option value="high">高细节：更仔细，适合火锅/拼盘/多菜</option>
            <option value="auto">自动：让模型自己判断</option>
          </select>
        </label>
      </section>

      <section class="settings-section">
        <h3>生理期预测</h3>
        <div class="form-row">
          <label>平均周期 天
            <input id="cycleLengthInput" type="number" min="18" max="45" step="1" />
          </label>
          <label>经期长度 天
            <input id="periodLengthInput" type="number" min="2" max="10" step="1" />
          </label>
        </div>
        <p class="soft-note">预测只是根据你记录的开始日期和平均周期估算，不替代医疗判断。</p>
      </section>

      <section class="settings-section">
        <h3>主题</h3>
        <label>预设主题
          <select id="themeInput">
            <option value="morandi-cream">奶油莫兰迪</option>
            <option value="morandi-pink">雾粉莫兰迪</option>
            <option value="morandi-sage">鼠尾草绿</option>
            <option value="morandi-blue">灰蓝冷淡风</option>
            <option value="night">夜间模式</option>
            <option value="custom">我的自定义</option>
          </select>
        </label>
        <div class="settings-actions small-gap">
          <button type="button" class="secondary-btn" id="resetThemeBtn">恢复当前主题默认色</button>
        </div>
        <div id="customColorPanel" class="color-panel"></div>
      </section>

      <section class="settings-section">
        <h3>外观 DIY</h3>
        <p class="soft-note">保留上面的预设色系，也可以继续加涂鸦、换字体、调透明度。颜色输入框会打开系统色卡；支持的浏览器会显示“吸色”。</p>
        <div class="form-row">
          <label>字体风格
            <select id="fontStyleInput">
              <option value="system">默认清爽</option>
              <option value="wenkai">温柔文楷</option>
              <option value="round">可爱圆润</option>
              <option value="elegant">简洁高级</option>
            </select>
          </label>
          <label>背景装饰
            <select id="decorPresetInput">
              <option value="none">无装饰</option>
              <option value="journal">温柔手帐风</option>
              <option value="food">可爱食物风</option>
              <option value="minimal">简洁高级风</option>
              <option value="custom">自定义混合</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>装饰密度
            <select id="decorDensityInput">
              <option value="low">少</option>
              <option value="medium">中</option>
              <option value="high">多</option>
            </select>
          </label>
          <label>装饰透明度 <span id="decorOpacityLabel" class="inline-value">22%</span>
            <input id="decorOpacityInput" type="range" min="0" max="0.65" step="0.01" />
          </label>
        </div>
        <div>
          <p class="field-title">装饰元素</p>
          <div id="decorElementsPanel" class="toggle-grid"></div>
        </div>
      </section>

      <div class="settings-actions">
        <button value="cancel" class="ghost-btn">取消</button>
        <button id="saveSettingsBtn" class="primary-btn">保存设置</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js?v=70"></script>
</body>
</html>
