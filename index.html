<!doctype html>
<html lang="zh-CN" data-theme="morandi-cream">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F0EA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>今天怎么吃</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=30" />
</head>
<body>
  <div class="phone-shell">
    <header class="topbar">
      <div>
        <p id="dateLabel" class="date-label">今天</p>
        <h1 id="greetingTitle">今天怎么吃</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="设置">⚙️</button>
    </header>

    <main id="app" class="app-content"></main>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item active" data-page="home"><span>🏠</span><small>首页</small></button>
      <button class="nav-item" data-page="log"><span>🍱</span><small>记录</small></button>
      <button class="nav-item" data-page="lists"><span>🧺</span><small>清单</small></button>
      <button class="nav-item" data-page="life"><span>💧</span><small>生活</small></button>
      <button class="nav-item" data-page="body"><span>📈</span><small>身体</small></button>
      <button class="nav-item" data-page="journal"><span>🌙</span><small>日记</small></button>
    </nav>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <h2>设置</h2>
          <p>名字、目标和颜色都可以在这里改。</p>
        </div>
        <button value="cancel" class="icon-btn" aria-label="关闭">×</button>
      </div>

      <section class="settings-section">
        <h3>基础</h3>
        <label>小软件名字
          <input id="appNameInput" type="text" placeholder="比如：今天怎么吃" />
        </label>
        <label>昵称
          <input id="nicknameInput" type="text" placeholder="比如：Celia" />
        </label>
        <div class="form-row">
          <label>每日目标热量 kcal
            <input id="calorieTargetInput" type="number" min="800" step="50" />
          </label>
          <label>每日蛋白质目标 g
            <input id="proteinTargetInput" type="number" min="20" step="5" />
          </label>
        </div>
        <div class="form-row">
          <label>每日饮水目标 杯
            <input id="waterTargetInput" type="number" min="1" max="20" step="1" />
          </label>
          <label>目标体重 kg
            <input id="weightTargetInput" type="number" min="20" step="0.1" />
          </label>
        </div>
        <label>我的饮食偏好
          <textarea id="preferenceInput" rows="3" placeholder="比如：喜欢辣，喜欢热食，减脂但不想极端节食"></textarea>
        </label>
      </section>

      <section class="settings-section">
        <h3>生理期预测</h3>
        <div class="form-row">
          <label>平均周期 天
            <input id="cycleLengthInput" type="number" min="18" max="45" step="1" />
          </label>
          <label>经期长度 天
            <input id="periodLengthInput" type="number" min="2" max="10" step="1" />
          </label>
        </div>
        <p class="soft-note">预测只是根据你记录的开始日期和平均周期估算，不替代医疗判断。</p>
      </section>

      <section class="settings-section">
        <h3>主题</h3>
        <label>预设主题
          <select id="themeInput">
            <option value="morandi-cream">奶油莫兰迪</option>
            <option value="morandi-pink">雾粉莫兰迪</option>
            <option value="morandi-sage">鼠尾草绿</option>
            <option value="morandi-blue">灰蓝冷淡风</option>
            <option value="night">夜间模式</option>
            <option value="custom">我的自定义</option>
          </select>
        </label>
        <div class="settings-actions small-gap">
          <button type="button" class="secondary-btn" id="resetThemeBtn">恢复当前主题默认色</button>
        </div>
        <div id="customColorPanel" class="color-panel"></div>
      </section>

      <div class="settings-actions">
        <button value="cancel" class="ghost-btn">取消</button>
        <button id="saveSettingsBtn" class="primary-btn">保存设置</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js?v=30"></script>
</body>
</html>
