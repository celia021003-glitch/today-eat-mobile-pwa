<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D8C2BC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="今天怎么吃" />
  <title>今天怎么吃</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone-shell">
    <div class="bg-blob blob-one"></div>
    <div class="bg-blob blob-two"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow" id="dateLabel">今天</p>
        <h1 id="greetingTitle">今天怎么吃</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
    </header>

    <main id="app" class="app-content"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-page="home"><span>🏠</span><em>首页</em></button>
      <button class="nav-item" data-page="log"><span>🍱</span><em>记录</em></button>
      <button class="nav-item" data-page="photo"><span>📷</span><em>拍照</em></button>
      <button class="nav-item" data-page="lists"><span>🧺</span><em>清单</em></button>
      <button class="nav-item" data-page="journal"><span>🌙</span><em>日记</em></button>
    </nav>

    <dialog id="settingsDialog" class="modal-card">
      <form method="dialog" class="settings-form">
        <div class="modal-head">
          <h2>小设置</h2>
          <button class="ghost-btn" value="cancel">关闭</button>
        </div>
        <label>昵称
          <input id="nicknameInput" type="text" placeholder="比如：Celia" />
        </label>
        <label>每日目标热量 kcal
          <input id="calorieTargetInput" type="number" min="800" max="4000" step="50" />
        </label>
        <label>每日蛋白质目标 g
          <input id="proteinTargetInput" type="number" min="20" max="250" step="5" />
        </label>
        <label>饮食偏好
          <textarea id="preferenceInput" rows="3" placeholder="比如：喜欢辣，喜欢热食，不想极端节食"></textarea>
        </label>
        <button id="saveSettingsBtn" class="primary-btn" value="default">保存设置</button>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
